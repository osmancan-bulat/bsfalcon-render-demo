# Render Blueprint: By Güzel yönetim merkezi demosu (ücretsiz statik site, byguzel-demo dalı).
# Next.js statik dışa aktarım (output: "export") → out/ klasörü yayımlanır.
services:
  - type: web
    name: byguzel-yonetim-merkezi
    branch: byguzel-demo
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
