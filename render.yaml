# Render Blueprint: Centro de Gestión EDIFICA (demo, sitio estático gratuito).
# Next.js con exportación estática (output: "export") → se publica la carpeta out/
services:
  - type: web
    name: edifica-centro-de-gestion
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
